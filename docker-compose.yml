services:
  postgres:
    image: postgres:17
    container_name: cleaning_app_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cleaning_app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cleaning_app"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
